<!DOCTYPE html>
<html>
<head>
    <title>Toko Skincare</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Toko Skincare</h1>

    <input type="text" id="cari" placeholder="Cari produk...">

    <div id="produk"></div>

    <button id="bukaKeranjang">Lihat Keranjang</button>

    <div id="keranjang">
        <h2>Keranjang Belanja</h2>
        <div id="isiKeranjang"></div>
        <p id="jumlah">Jumlah item: 0</p>
        <p id="total">Total: Rp0</p>

        <button id="kosongkan">Kosongkan Keranjang</button>
        <button id="checkout">Checkout</button>
    </div>

    <div id="hasil"></div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="script.js"></script>

</body>
</html>
